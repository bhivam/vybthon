[project]
name = "vibethon"
version = "0.1.0"
description = "Objects whose methods are written by a local LLM the moment you call them"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.88.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibe"]
